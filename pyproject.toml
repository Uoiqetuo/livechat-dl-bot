[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livechat-dl-bot"
version = "0.1.0"
description = "Discord bot for downloading YouTube Live Chat recordings"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.3",
  "yt-dlp>=2025.11.12",
  "yt-dlp-ejs>=0.8.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
livechat-bot = "livechat_bot.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
